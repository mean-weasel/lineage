# GoalBuddy v2 state.yaml
# Board truth lives here. goal.md is the editable charter; notes/ holds long receipts only.

version: 2

goal:
  title: "Static image output target adoption"
  slug: "static-image-output-target-adoption"
  kind: existing_plan
  tranche: "Release the merged output-target feature, dogfood its critical workflows, apply evidence-backed UX polish, and prove one provider-neutral agent generation loop."
  status: active
  oracle:
    signal: "A released Lineage build completes the approved dogfood scenarios and one agent plan-to-generation-to-validated-import workflow with recorded evidence and no unresolved critical friction."
    cadence: "after each Worker package and at final audit"
    final_proof: "Release receipts, live workflow evidence, focused/full gates, and a final acceptance-to-evidence audit."
  intake:
    original_request: "Make a GoalBuddy prep board to knock these out."
    interpreted_outcome: "Ship and operationalize the merged static-image output-target feature through release, dogfood, targeted polish, and agent-generation integration."
    input_shape: existing_plan
    audience: "Lineage users and agents creating platform-specific static-image variants"
    authority: approved
    proof_type: demo
    completion_proof: "The released build and final integrated agent workflow pass live, identity-gated walkthroughs and all required repository gates."
    likely_misfire: "Declaring adoption complete after a version bump or scripted happy path without learning from real workflow friction or proving the agent-generation-import loop."
    blind_spots_considered:
      - "Release work may collide with unrelated version changes already landing on main."
      - "Dogfood can become theater if it does not record concrete friction and disposition it."
      - "Agent integration could accidentally put provider calls or mutable defaults inside Lineage."
      - "A generated file may satisfy prompt intent but still violate the frozen pixel contract."
      - "Broader video, publishing, transform, or safe-zone work could dilute this tranche."
    existing_plan_facts:
      - "Release the merged feature."
      - "Dogfood ambiguous Instagram, multi-source override, and locked-reroll workflows."
      - "Use dogfood evidence to improve discoverability and ergonomics."
      - "Connect frozen plans more directly to image-generation tooling while keeping Lineage provider-neutral."
      - "Keep video, transforms, automated safe-zone validation, publishing, and scheduling deferred."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  exact_human_approval_can_terminal_wait: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: installed
  worker: installed
  judge: installed

visual_board:
  selected: local
  local:
    status: live
    url: "http://goalbuddy.localhost:41737/static-image-output-target-adoption-2/"
