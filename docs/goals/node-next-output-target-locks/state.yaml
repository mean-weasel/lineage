    receipt:
      result: done
      decision: remediation_required
      full_outcome_complete: false
      rationale: "The integrated surfaces share the same canonical target resolver and browser/CLI digest parity is proven, but two realistic stale-intent bypasses remain. Locked-from-node planning resolves and checks the digest on one SQLite connection, closes it, then persists on another, allowing a node/default mutation between validation and job creation. The geometry-changing reroll path constructs a transient custom target map directly from requestedDimensions, without durable node intent or an expected resolution digest. Both violate the approved read-before-generate contract and must be closed before the live oracle."
      decision_matrix:
        - "approved: current output geometry remains separate from future node intent"
        - "approved: node/default precedence, sticky CAS, explicit replace/clear, provenance, frozen metadata, multi-source resolution, child-only produced geometry, cancellation/import race guards"
        - "approved: selection packet v3, CLI read/set/replace/clear, ambiguity refusal, complete JSON, agent read-only canvas defaults"
        - "approved: canvas uses the persisted source-resolution digest and the backend canonical resolver; the real browser test proves digest parity"
        - "rejected: committed locked-from-node plan validation and persistence are not one transaction"
        - "rejected: geometry-changing reroll can bypass persisted node intent with requestedDimensions"
      evidence:
        - "src/server/generationReceipts.ts opens targetDatabase to resolve/check expectedTargetResolutionDigest, closes it, then later opens database and calls persistTargetAwareGenerationAggregate."
        - "src/server/generationTargetPersistence.ts persistTargetAwareGenerationAggregate begins its own transaction only after the earlier resolution connection has closed."
        - "src/server/generationReceipts.ts planImageReroll builds variationMap directly from fields.requestedDimensions and persists it without source_target_resolutions."
        - "src/web/components/LineageDetailModal.tsx exposes that requestedDimensions bypass through the geometry-change reroll form."
        - "e2e/output-target-locks.e2e.ts proves the canvas-computed aggregate digest is accepted by the backend and frozen into the job."
      top_failure_modes:
        - "Concurrent node/default change lands after digest validation but before job insert, producing a stale job even though the caller's digest was accepted."
        - "A geometry-changing reroll plans from transient pixels that were never stored on the node and therefore cannot be read natively by another agent or surface."
        - "Future refactors preserve happy-path tests while reopening one of the alternate route bypasses unless deterministic regression tests cover the transaction and reroll paths."
      remaining_blockers:
        - "T011 must pass before the checkout oracle."
      verification_attempts: 1
      stopped_because: "Integrated review found two goal-owned contract violations."
