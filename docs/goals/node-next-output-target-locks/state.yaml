# GoalBuddy v2 state.yaml
# Board truth lives here. goal.md is the editable charter; notes/ holds long receipts only.

version: 2

goal:
  title: "Node next-output target locks"
  slug: "node-next-output-target-locks"
  kind: existing_plan
  tranche: "Implement, release, and stable-package-verify the approved node next-output target-lock bridge for static-image variations."
  status: active
  oracle:
    signal: "A live canvas/CLI/agent walkthrough proves every generated static-image variation consumes an immutable exact-pixel plan resolved from a node override or human canvas default."
    cadence: "after each Worker package and at final audit"
    final_proof: "Automated contract, CLI, and canvas tests plus a released stable-package walkthrough proving inheritance, override conflict refusal, immutable snapshots, child inheritance, exact import, and zero-partial-write rejection."
  intake:
    original_request: "Create a GoalBuddy prep board for durable node-level next-variation geometry that agents read before generation."
    interpreted_outcome: "Before any static-image variation is generated, Lineage resolves persisted exact geometry from the source node or its human canvas default and snapshots it into an immutable job."
    input_shape: existing_plan
    audience: "Lineage users and agents creating static-image variations"
    authority: approved
    proof_type: demo
    completion_proof: "The full bridge oracle passes in checkout verification and again against the released stable package from a fresh named production profile."
    likely_misfire: "Ship node badges or geometry storage without making the agent read and atomically snapshot the same durable intent before provider generation."
    blind_spots_considered:
      - "Agent intent conflicts with a sticky node lock."
      - "Node settings, canvas defaults, and immutable planned jobs have distinct lifecycles."
      - "Each generated child inherits only its own produced geometry."
      - "Multiple delivery surfaces may share one exact geometry."
      - "Concurrent setting changes must fail closed without mutating older jobs."
      - "Variation counts and creative splits remain job-time intent."
    existing_plan_facts:
      - "Approved design: docs/superpowers/specs/2026-07-27-node-next-output-target-locks-design.md"
      - "Fresh worktree: /Users/neonwatty/Desktop/lineage/.worktrees/node-next-output-target-locks"
      - "Branch codex/node-next-output-target-locks was created from freshly fetched origin/main commit 3881139d7932669565dabe967e2385fa6e67cf62."
      - "Baseline npm test passed 598 tests with 4 intentional skips before board creation."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  exact_human_approval_can_terminal_wait: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: installed
  worker: installed
  judge: installed

visual_board:
  selected: local
  local:
    status: live
    url: "http://goalbuddy.localhost:41737/node-next-output-target-locks/"
    command: "node /Users/neonwatty/.codex/plugins/cache/goalbuddy/goalbuddy/0.4.1/skills/goal-prep/surfaces/local-goal-board/scripts/local-goal-board.mjs --goal docs/goals/node-next-output-target-locks"

