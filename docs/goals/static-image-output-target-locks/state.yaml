  oracle:
    signal: "A live checkout walkthrough and receipt-backed tests prove that agent, CLI, and canvas create the same locked static-image jobs and atomically reject every dimension mismatch."
    cadence: "after each Worker package and at final audit"
    final_proof: "Every approved behavior maps to passing focused tests, full repository gates, and an identity-gated browser/CLI walkthrough."
  intake:
    original_request: "Plan implementation using GoalBuddy prep as atomic, verifiable tasks with sharp, measurable acceptance criteria."
    interpreted_outcome: "A GoalBuddy board carries the approved static-image output-target design through bounded implementation slices to end-to-end proof."
    input_shape: existing_plan
    audience: "Lineage users creating and importing static-image variants through agents, CLI, and canvas"
    authority: approved
    proof_type: demo
    completion_proof: "The full oracle passes with no queued required work and a final Judge records full_outcome_complete: true."
    likely_misfire: "Implementing labels, controls, or schemas without enforcing immutable pixels, atomic import, per-source mapping, and cross-surface parity."
    blind_spots_considered:
      - "Incorrect grouping can duplicate, collapse, or cross-apply source targets."
      - "Validation can be bypassed by corrupt, renamed, animated, or partially imported media."
      - "Mutable defaults, registry changes, or rerolls can silently alter frozen intent."
      - "New target-aware behavior can accidentally break legacy unlocked jobs."
      - "A passing file-level test can hide agent/CLI/canvas disagreement."
    existing_plan_facts:
      - "Approved design: docs/superpowers/specs/2026-07-27-static-image-output-target-locks-design.md"
      - "Static images only; exact pixel dimensions are the v1 hard contract."
      - "Ambiguous platform-only requests require a surface choice."
      - "Geometry and delivery surfaces are separate; shared dimensions consolidate unless explicitly split."
      - "Target-aware multi-source jobs require explicit per-source mapping."
      - "Canvas defaults are explicit and human-managed; agents and CLI have read-only access."
      - "Rerolls inherit locks; geometry changes create child variations."
      - "Custom sizes are bounded to 16..16384 per side and 100000000 decoded pixels."
      - "PNG, JPEG, and WebP are supported; other, corrupt, renamed, or tampered media fail closed."
      - "All import inputs are prevalidated before any persistent write."
      - "Existing unlocked jobs and protocols remain compatible."
      - "All execution occurs in /Users/neonwatty/Desktop/lineage/.worktrees/static-image-output-target-locks on codex/static-image-output-target-locks, created from freshly fetched GitHub origin/main eef358ba16f60619f6ba8104d3bed14ab8d58257."

rules:
